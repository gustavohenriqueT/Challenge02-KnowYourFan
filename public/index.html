<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your Fan - FURIA</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login View -->
        <div id="login-view" class="view">
            <div class="login-container">
                <img src="/assets/furia-logo.png" alt="FURIA Logo" class="login-logo">
                <h2>Know Your Fan</h2>
                <form id="loginForm" class="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <div id="login-error" class="error-message"></div>
            </div>
        </div>

        <!-- Main App (hidden initially) -->
        <div id="app-view" class="view" style="display:none">
            <header class="navbar">
                <img src="/assets/furia-logo.png" alt="FURIA Logo" class="navbar-logo">
                <nav class="nav-links">
                    <a href="#" data-view="dashboard" class="nav-link active">Dashboard</a>
                    <a href="#" data-view="fans" class="nav-link">Fans</a>
                    <a href="#" data-view="analytics" class="nav-link">Analytics</a>
                    <button id="logout-btn" class="logout-btn">Logout</button>
                </nav>
            </header>

            <main class="container">
                <!-- Dashboard View -->
                <div id="dashboard-view" class="sub-view">
                    <h1>Fan Dashboard</h1>
                    <div class="dashboard-grid" id="dashboard-cards"></div>
                </div>

                <!-- Fans View -->
                <div id="fans-view" class="sub-view" style="display:none">
                    <div class="fans-header">
                        <h1>Fan Profiles</h1>
                        <div class="filters">
                            <input type="text" id="search-fans" placeholder="Search fans...">
                            <select id="location-filter">
                                <option value="">All Locations</option>
                            </select>
                            <select id="game-filter">
                                <option value="">All Games</option>
                            </select>
                        </div>
                    </div>
                    <div class="fans-grid" id="fans-container"></div>
                </div>

                <!-- Analytics View -->
                <div id="analytics-view" class="sub-view" style="display:none">
                    <h1>Fan Analytics</h1>
                    <div class="charts-container">
                        <div class="chart-card">
                            <h3>Fans by Location</h3>
                            <div id="location-chart" class="chart"></div>
                        </div>
                        <div class="chart-card">
                            <h3>Fans by Game</h3>
                            <div id="game-chart" class="chart"></div>
                        </div>
                        <div class="chart-card">
                            <h3>Engagement Levels</h3>
                            <div id="engagement-chart" class="chart"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
